{% extends "base.html" %}

{% block title %}New Announcement | EXPECTO-27{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <h1 class="text-2xl sm:text-3xl font-bold text-white mb-6 break-words">Create New Post</h1>

    <form method="POST" action="/posts" class="space-y-6">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-300 mb-1">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ title }}"
                required
                maxlength="200"
                class="w-full px-4 py-3 bg-white/5 border border-white/10 text-white rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors placeholder-gray-500"
                placeholder="Enter post title"
            >
        </div>

        <div>
            <label for="content" class="block text-sm font-medium text-gray-300 mb-1">Content</label>
            <textarea
                id="content"
                name="content"
                required
                rows="10"
                class="w-full px-4 py-3 bg-white/5 border border-white/10 text-white rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors resize-y placeholder-gray-500"
                placeholder="Write your post content here...">{{ content }}</textarea>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
            <button type="submit" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-emerald-500 transition-colors">
                Create Post
            </button>
            <a href="/posts" class="px-6 py-3 border border-white/10 rounded-lg font-medium text-gray-300 hover:bg-white/5 transition-colors flex items-center justify-center">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
